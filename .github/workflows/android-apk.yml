name: Android APK

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag that receives the built APK (for example, v1.3.0)
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run android:sync
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: mmv-hub-installable-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="${RELEASE_TAG:-v$(node -p "require('./package.json').version")}"
          apk_path="MMV-Hub-${release_tag}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk_path"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$apk_path#MMV Hub ${release_tag} Android APK" --clobber
          else
            gh release create "$release_tag" "$apk_path#MMV Hub ${release_tag} Android APK" \
              --target "$GITHUB_SHA" \
              --title "MMV Hub ${release_tag}" \
              --notes "Installable Android build with Firebase integration, MMV Classics, responsive navigation, reminders, calendar access, and creation-flow fixes."
          fi
