services:
  - type: web
    name: mmv-subs-telegram-bot
    runtime: node
    region: frankfurt
    plan: free
    rootDir: telegram-bot
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TIME_ZONE
        value: Asia/Tashkent
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIRESTORE_DATABASE_ID
        value: ai-studio-mmvsubs-7f61226f-682f-4402-823f-82cb55675031
